name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @opencode/cli@2.0.21
      - run: npx vp check
      - run: npx tsc --noEmit
      - run: npx vp test run
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Tag $RELEASE_TAG does not match $expected_tag"
            exit 1
          fi
      - name: Skip already-published version
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@falentio/opencode-todo@${version}" version >/dev/null 2>&1; then
            echo "Version ${version} is already published."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Strip empty _authToken from .npmrc
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            # setup-node writes an empty _authToken line that blocks npm's OIDC exchange
            sed -i '/_authToken/d' "$npmrc"
          fi
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public
