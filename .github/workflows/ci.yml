name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @opencode/cli@2.0.21
      - run: npx vp check
      - run: npx tsc --noEmit
      - run: npx vp test run
      - run: npx vp pack
      - run: node scripts/publish-probe.mjs
